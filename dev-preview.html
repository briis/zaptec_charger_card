<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaptec Go 2 Charger Card — Dev Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: sans-serif;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      --bg: #111827;
      --fg: #f3f4f6;
      --card-bg: #1f2937;
      --card-border: #374151;
      --ha-card-background: #1f2937;
      --card-background-color: #1f2937;
      --primary-text-color: #f3f4f6;
      --secondary-text-color: #9ca3af;
      --secondary-background-color: rgba(255,255,255,0.06);
      --divider-color: #374151;
    }
    body.light {
      --bg: #f3f4f6;
      --fg: #111827;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --ha-card-background: #ffffff;
      --card-background-color: #ffffff;
      --primary-text-color: #111827;
      --secondary-text-color: #6b7280;
      --secondary-background-color: rgba(0,0,0,0.05);
      --divider-color: #e5e7eb;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .toolbar h1 { margin: 0; font-size: 16px; font-weight: 600; flex-basis: 100%; }

    label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
    input[type=number] { width: 80px; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--fg); }
    select {
      padding: 4px 6px; border-radius: 4px; border: 1px solid var(--card-border);
      background: var(--card-bg); color: var(--fg); font-size: 13px;
    }
    input[type=checkbox] { width: 16px; height: 16px; }

    .card-wrap {
      width: 100%;
      max-width: 360px;
      height: 640px;
      --ha-card-background: var(--ha-card-background);
      --card-background-color: var(--card-background-color);
      --primary-text-color: var(--primary-text-color);
      --secondary-text-color: var(--secondary-text-color);
      --secondary-background-color: var(--secondary-background-color);
      --divider-color: var(--divider-color);
    }
    zaptec-charger-card {
      display: block;
      width: 100%;
      height: 100%;
    }

    ha-card {
      display: block;
      background: var(--ha-card-background, #1f2937);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      height: 100%;
    }
  </style>
</head>
<body class="dark">

  <div class="toolbar">
    <h1>Zaptec Go 2 Charger Card — Dev Preview</h1>

    <label>
      Theme
      <select id="themeSelect">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>

    <label>
      Lang
      <select id="langSelect">
        <option value="da" selected>DA</option>
        <option value="en">EN</option>
      </select>
    </label>

    <label>
      Charger mode
      <select id="modeSelect">
        <option value="disconnected">disconnected</option>
        <option value="connected_requesting" selected>connected_requesting</option>
        <option value="connected_charging">connected_charging</option>
        <option value="connected_finished">connected_finished</option>
      </select>
    </label>

    <label>
      Schedule automation
      <select id="automationSelect">
        <option value="none" selected>not set up (no helper/automation)</option>
        <option value="off">off</option>
        <option value="on">on</option>
      </select>
    </label>

    <label>
      Authorized
      <input type="checkbox" id="authorizedInput" />
    </label>

    <label>
      Admin user
      <input type="checkbox" id="adminInput" checked />
    </label>

    <label>
      Price (kr/kWh)
      <input type="number" id="priceInput" value="1.85" step="0.01" />
    </label>

    <label>
      Power (kW)
      <input type="number" id="powerInput" value="7200" step="10" /> W
    </label>

    <label>
      Current per phase (A)
      <input type="number" id="currentInput" value="16" step="1" />
    </label>

    <label>
      Session energy (kWh)
      <input type="number" id="energyInput" value="12.4" step="0.1" />
    </label>

    <label>
      Charger visual
      <select id="chargerVisual">
        <option value="builtin" selected>built-in drawing</option>
        <option value="icon">icon</option>
        <option value="image">image</option>
      </select>
      <input type="text" id="chargerIcon" value="mdi:ev-station" style="width:120px" />
      <input type="text" id="chargerImage" value="/images/charger-test.svg" style="width:180px" />
    </label>

    <label>
      Left car SoC
      <input type="checkbox" id="leftSocEnabled" checked />
      <input type="number" id="leftSocValue" value="68" min="0" max="100" step="1" style="width:56px" />
      <input type="text" id="leftSocName" value="EQC" style="width:70px" />
      <input type="color" id="leftSocColor" value="#4caf50" />
      <input type="text" id="leftSocImage" placeholder="image URL (optional)" style="width:160px" />
    </label>

    <label>
      Right car SoC
      <input type="checkbox" id="rightSocEnabled" />
      <input type="number" id="rightSocValue" value="42" min="0" max="100" step="1" style="width:56px" />
      <input type="text" id="rightSocName" value="Model Y" style="width:70px" />
      <input type="color" id="rightSocColor" value="#ef5350" />
      <input type="text" id="rightSocImage" placeholder="image URL (optional)" style="width:160px" />
    </label>
  </div>

  <div class="card-wrap">
    <zaptec-charger-card></zaptec-charger-card>
  </div>

  <!-- Minimal shims so the card renders standalone, outside a real HA frontend -->
  <script>
    customElements.define('ha-card', class extends HTMLElement {
      connectedCallback() { this.style.display = 'block'; }
    });

    const ICON_GLYPH = {
      'mdi:cash':                '💰',
      'mdi:lightning-bolt':      '⚡',
      'mdi:current-ac':          '🔌',
      'mdi:car-electric':        '🚗',
      'mdi:battery-charging-80': '🔋',
      'mdi:car-clock':           '🕒',
      'mdi:flash':               '⚡',
      'mdi:clock-start':         '⏱',
      'mdi:stop-circle-outline': '⏹',
      'mdi:cancel':              '🚫',
      'mdi:ev-station':          '⛽',
    };
    customElements.define('ha-icon', class extends HTMLElement {
      static get observedAttributes() { return ['icon']; }
      connectedCallback() { this._render(); }
      attributeChangedCallback() { this._render(); }
      _render() {
        const icon = this.getAttribute('icon') || '';
        this.textContent = ICON_GLYPH[icon] || '●';
        Object.assign(this.style, {
          display: 'inline-flex',
          alignItems: 'center',
          justifyContent: 'center',
          fontSize: 'var(--mdc-icon-size, 16px)',
          lineHeight: '1',
        });
      }
    });
  </script>

  <script type="module" src="/dist/zaptec-charger-card.js"></script>

  <script>
    const card = document.querySelector('zaptec-charger-card');
    const $ = id => document.getElementById(id);

    const CONFIG = {}; // rely entirely on auto-detection, like a fresh install

    // Fake registry mirroring a real Zaptec install: one installation device
    // and one charger device in the same config entry.
    const INSTALLATION = 'dev_installation_device';
    const CHARGER      = 'dev_charger_device';
    const ENTRY        = 'dev_zaptec_entry';
    const ZAPTEC_ENTITIES = {
      'sensor.ev_ev_charger_charger_mode':                 CHARGER,
      'switch.ev_ev_charger_charging':                     CHARGER,
      'button.ev_ev_charger_authorize_charging':           CHARGER,
      'button.ev_ev_charger_deauthorize_charging':         CHARGER,
      'binary_sensor.ev_ev_charger_authorized_power':      CHARGER,
      'sensor.ev_ev_charger_session_total_charge':         CHARGER,
      'sensor.ev_ev_charger_charge_power':                 CHARGER,
      'sensor.ev_ev_charger_current_phase_1':              CHARGER,
      'sensor.ev_ev_charger_current_phase_2':              CHARGER,
      'sensor.ev_ev_charger_current_phase_3':              CHARGER,
      'number.ev_installation_available_current':          INSTALLATION,
      'sensor.ev_installation_available_current_phase_1':  INSTALLATION,
    };

    // Fake automation store, as written by POST config/automation/config/<id>
    const automations = {}; // id -> { config, entityId, state }
    // Fake storage helpers, as created by input_datetime/create
    const helpers = {};     // entityId -> { name, state }
    let availableCurrent = 16;

    function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); }

    async function callApi(method, path, body) {
      console.log('[hass.callApi]', method, path, body);
      const id = path.split('/').pop();
      const existing = automations[id];
      // Mimic HA: reload happens shortly after the write, entity_id from the first alias.
      setTimeout(() => {
        automations[id] = {
          config: body,
          entityId: existing?.entityId || `automation.${slug(body.alias)}`,
          state: existing?.state || 'on',
        };
        $('automationSelect').value = automations[id].state;
        pushUpdate();
      }, 300);
      return {};
    }

    function onlyAutomation() { return Object.values(automations)[0]; }

    async function callWS(msg) {
      console.log('[hass.callWS]', msg);
      if (!$('adminInput').checked) throw new Error('Unauthorized (admin only)');
      if (msg.type === 'input_datetime/create') {
        const entityId = `input_datetime.${slug(msg.name)}`;
        setTimeout(() => { helpers[entityId] = { name: msg.name, state: '00:00:00' }; pushUpdate(); }, 200);
        return { id: slug(msg.name), name: msg.name };
      }
      if (msg.type === 'automation/config') {
        const a = Object.entries(automations).find(([, x]) => x.entityId === msg.entity_id);
        return { config: a ? { id: a[0], ...a[1].config } : null };
      }
      throw new Error('unknown ws command ' + msg.type);
    }

    function callService(domain, service, data, target) {
      console.log('[hass.callService]', domain + '.' + service, { data, target });

      if (domain === 'automation') {
        const a = Object.values(automations).find(x => x.entityId === target.entity_id);
        if (a) {
          a.state = service === 'toggle' ? (a.state === 'on' ? 'off' : 'on') : (service === 'turn_on' ? 'on' : 'off');
          $('automationSelect').value = a.state;
        }
      }
      if (domain === 'button' && service === 'press' && target.entity_id.endsWith('_authorize_charging')) {
        $('authorizedInput').checked = true;
        if (availableCurrent > 0) $('modeSelect').value = 'connected_charging';
      }
      if (domain === 'input_datetime' && service === 'set_datetime' && helpers[target.entity_id]) {
        helpers[target.entity_id].state = data.time;
      }
      if (domain === 'switch' && service === 'turn_off') {
        $('modeSelect').value = 'connected_finished';
      }
      if (domain === 'zaptec' && service === 'limit_current') {
        availableCurrent = data.available_current;
        $('currentInput').value = data.available_current;
        if (availableCurrent > 0 && $('authorizedInput').checked) $('modeSelect').value = 'connected_charging';
      }
      pushUpdate();
      return Promise.resolve();
    }

    function buildConfig() {
      const leftOn  = $('leftSocEnabled').checked;
      const rightOn = $('rightSocEnabled').checked;
      return {
        ...CONFIG,
        left_soc_entity:  leftOn ? 'sensor.left_car_state_of_charge' : null,
        left_soc_name:    $('leftSocName').value,
        left_soc_color:   $('leftSocColor').value,
        left_soc_image:   $('leftSocImage').value || null,
        right_soc_entity: rightOn ? 'sensor.right_car_state_of_charge' : null,
        right_soc_name:   $('rightSocName').value,
        right_soc_color:  $('rightSocColor').value,
        right_soc_image:  $('rightSocImage').value || null,
        charger_icon:     $('chargerVisual').value === 'icon'  ? $('chargerIcon').value  : null,
        charger_image:    $('chargerVisual').value === 'image' ? $('chargerImage').value : null,
      };
    }

    // Registry objects keep their identity across updates, like the real frontend.
    const ENTITY_REGISTRY = Object.fromEntries(Object.entries(ZAPTEC_ENTITIES).map(([entity_id, device_id]) =>
      [entity_id, { entity_id, device_id, platform: 'zaptec' }]));
    const DEVICE_REGISTRY = {
      [INSTALLATION]: { id: INSTALLATION, config_entries: [ENTRY] },
      [CHARGER]:      { id: CHARGER, config_entries: [ENTRY] },
    };

    function makeHass() {
      const now = new Date().toISOString();
      const mkState = (state_, unit, extra = {}) => ({
        state: String(state_),
        attributes: { unit_of_measurement: unit, ...extra },
        last_changed: now,
        last_updated: now,
      });

      const mode    = $('modeSelect').value;
      const current = $('currentInput').value;

      const states = {
        'sensor.ev_ev_charger_charger_mode':            mkState(mode),
        'switch.ev_ev_charger_charging':                mkState(mode === 'connected_charging' ? 'on' : 'off'),
        'button.ev_ev_charger_authorize_charging':      mkState('unknown'),
        'binary_sensor.ev_ev_charger_authorized_power': mkState($('authorizedInput').checked ? 'on' : 'off'),
        'sensor.stromligning_current_price_vat':        mkState($('priceInput').value, 'kr/kWh'),
        'sensor.ev_ev_charger_session_total_charge':    mkState($('energyInput').value, 'kWh'),
        'sensor.ev_ev_charger_charge_power':            mkState($('powerInput').value, 'W'),
        'sensor.ev_ev_charger_current_phase_1':         mkState(current, 'A'),
        'sensor.ev_ev_charger_current_phase_2':         mkState(current, 'A'),
        'sensor.ev_ev_charger_current_phase_3':         mkState(current, 'A'),
        'number.ev_installation_available_current':     mkState(availableCurrent, 'A'),
        'sensor.ev_installation_available_current_phase_1': mkState(99, 'A'), // must NOT be picked as live current
        'sensor.left_car_state_of_charge':              mkState($('leftSocValue').value, '%'),
        'sensor.right_car_state_of_charge':             mkState($('rightSocValue').value, '%'),
      };
      for (const [entityId, h] of Object.entries(helpers)) {
        states[entityId] = mkState(h.state, undefined, { friendly_name: h.name, has_date: false, has_time: true, editable: true });
      }
      for (const [id, a] of Object.entries(automations)) {
        states[a.entityId] = mkState(a.state, undefined, { id, friendly_name: a.config.alias });
      }

      return {
        language: $('langSelect').value,
        user: { is_admin: $('adminInput').checked },
        states,
        entities: ENTITY_REGISTRY,
        devices: DEVICE_REGISTRY,
        callService,
        callApi,
        callWS,
      };
    }

    let lastConfigKey = null;
    function pushUpdate() {
      const cfg = buildConfig();
      const key = JSON.stringify(cfg);
      if (key !== lastConfigKey) {
        lastConfigKey = key;
        try { card.setConfig(cfg); } catch (_) {}
      }
      card.hass = makeHass();
    }
    window.__automations = automations; // for poking at from the console
    window.__helpers = helpers;

    customElements.whenDefined('zaptec-charger-card').then(() => pushUpdate());

    [
      'modeSelect', 'authorizedInput', 'adminInput', 'priceInput', 'powerInput',
      'currentInput', 'energyInput', 'langSelect',
      'leftSocEnabled', 'leftSocValue', 'leftSocName', 'leftSocColor', 'leftSocImage',
      'rightSocEnabled', 'rightSocValue', 'rightSocName', 'rightSocColor', 'rightSocImage',
      'chargerVisual', 'chargerIcon', 'chargerImage',
    ].forEach(id => {
      $(id).addEventListener('input', pushUpdate);
      $(id).addEventListener('change', pushUpdate);
    });

    // The toolbar can force the automation state, or wipe helper + automation.
    $('automationSelect').addEventListener('change', e => {
      if (e.target.value === 'none') {
        for (const k of Object.keys(automations)) delete automations[k];
        for (const k of Object.keys(helpers)) delete helpers[k];
      } else if (onlyAutomation()) {
        onlyAutomation().state = e.target.value;
      }
      pushUpdate();
    });

    $('themeSelect').addEventListener('change', e => {
      document.body.className = e.target.value;
    });
  </script>
</body>
</html>
